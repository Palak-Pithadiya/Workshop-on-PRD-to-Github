<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7fb">
    <meta name="description" content="Sunday Workshop is a portfolio prototype for planning, running, and reviewing an in-context Copilot task.">
    <title>Sunday Workshop | Copilot Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#workspace" data-view="workspace" aria-label="Sunday Workshop workspace">
          <span class="brand-mark" aria-hidden="true"><span class="material-symbols-rounded">smart_toy</span></span>
          <span class="brand-copy"><strong>Copilot</strong><span>WORKSPACE <i>PREVIEW</i></span></span>
        </a>

        <div class="tenant-block">
          <span class="tenant-avatar">A</span>
          <span><strong>Aanya Sharma</strong><small>APAC Growth Hub</small></span>
          <span class="material-symbols-rounded tenant-more" aria-hidden="true">more_horiz</span>
        </div>

        <p class="nav-label">WORKSPACE</p>
        <nav class="primary-nav" aria-label="Workspace views">
          <button class="nav-item is-active" type="button" data-view="workspace"><span class="material-symbols-rounded" aria-hidden="true">space_dashboard</span><span>Workspace</span></button>
          <button class="nav-item" type="button" data-view="live"><span class="material-symbols-rounded" aria-hidden="true">motion_play</span><span>Live tasks</span><span class="nav-count" id="live-count">0</span></button>
          <button class="nav-item" type="button" data-view="workflows"><span class="material-symbols-rounded" aria-hidden="true">account_tree</span><span>Workflows</span></button>
          <button class="nav-item" type="button" data-view="history"><span class="material-symbols-rounded" aria-hidden="true">history</span><span>History</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="privacy-note"><span class="material-symbols-rounded" aria-hidden="true">shield_lock</span><span><strong>Local demo mode</strong><small>Sample data stays in this browser.</small></span></div>
          <button class="text-button clear-button" type="button" data-action="clear-data"><span class="material-symbols-rounded" aria-hidden="true">delete_sweep</span>Clear demo data</button>
          <div class="sidebar-foot">SUNDAY WORKSHOP <span>•</span> CONCEPT BUILD</div>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="breadcrumb"><span>Copilot</span><span class="crumb-divider">/</span><strong id="topbar-view">Workspace</strong></div>
          <div class="topbar-right">
            <span class="demo-status"><span class="status-dot"></span> Connectors simulated</span>
            <button class="icon-button notification-button" type="button" aria-label="Notifications"><span class="material-symbols-rounded" aria-hidden="true">notifications</span><span class="notification-dot"></span></button>
            <span class="avatar-small" aria-label="Aanya Sharma">AS</span>
          </div>
        </header>

        <main id="app-main" class="content" tabindex="-1"></main>
        <nav id="mobile-nav" class="mobile-nav" aria-label="Main navigation"></nav>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
